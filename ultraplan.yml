version: 1
runtime:
  default: opencode
models:
  default: openrouter/minimax/minimax-m3:free
  primary: openrouter/minimax/minimax-m3:free
  backup: openrouter/minimax/minimax-m3:free
execution:
  default_variant: high
  default_parallel: 5
  default_timeout: 12m
  default_retries: 1
planning:
  requirements_model: openai/gpt-5.6-sol
  requirements_variant: high
  code_context_model: openai/gpt-5.6-sol
  code_context_variant: low
  sprint_index_model: openai/gpt-5.6-sol
  sprint_index_variant: high
  technical_handbook_model: openai/gpt-5.6-sol
  technical_handbook_variant: high
  area_reasoning_model: openai/gpt-5.6-sol
  area_reasoning_variant: high
  reasoning_model: openai/gpt-5.6-sol
  reasoning_variant: high
  plan_model: openai/gpt-5.6-sol
  plan_variant: high
  review_model: openrouter/minimax/minimax-m3:free
  smoke_model: openai/gpt-5.6-sol
  smoke_variant: low
  execute_model: openai/gpt-5.6-sol
  execute_variant: high
qa:
  # Keep per_issue for the existing one-worker-per-issue path. Set grouped and
  # raise issues_per_repair_agent to create fewer sequential worker queues.
  repair_assignment_mode: per_issue
  issues_per_repair_agent: 1
  # Empty role overrides inherit qa.model, then the review/plan/default chain.
  investigator_model: openai/gpt-5.6-sol
  investigator_variant: high
  challenger_model: openai/gpt-5.6-sol
  challenger_variant: high
  evaluator_model: openai/gpt-5.6-sol
  evaluator_variant: high
  repair_model: openai/gpt-5.6-sol
  repair_variant: high
logging:
  format: text
  level: debug
agentwrap:
  executable: opencode
  permission_default: allow
  required_health:
    - runtime_available
    - structured_output
    - workdir
